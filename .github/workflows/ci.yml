name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci exige que el lockfile ya tenga resueltas las variantes nativas
      # de esbuild para linux-x64; el lockfile se genera en Windows y no
      # siempre las incluye, así que usamos npm install (resuelve en el momento).
      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # El despliegue de supabase/migrations (esquema + RLS + trigger) y de
  # supabase/functions (Edge Functions) no está automatizado todavía — se
  # corre manualmente con `supabase db push` / `supabase functions deploy`
  # una vez exista el proyecto de Supabase y sus secretos en este repo.
