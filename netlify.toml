# netlify.toml — Configuración para Netlify
# No necesitas tocar este archivo.

[[headers]]
  for = "/*"
  [headers.values]
    # Permite que Firebase (gstatic.com) cargue los módulos JS
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com https://*.firebaseapp.com https://*.googleapis.com https://*.firebasestorage.googleapis.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.firebasestorage.googleapis.com https://firebasestorage.googleapis.com;"

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
